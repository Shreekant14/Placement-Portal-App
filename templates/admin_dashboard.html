<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #3b135c, #6a1b9a);
            color: white;
        }

        .card-box {
            background: white;
            color: black;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">Admin Dashboard</h2>

    <div class="card-box">
        <h5>Total Companies</h5>
        <p>{{ companies|length }}</p>
    </div>

    <div class="card-box">
        <h5>Company Approval List</h5>

        {% for c in companies %}
    <div class="d-flex justify-content-between align-items-center mb-2">

        <span>
            {{ c.name }} 
            ({{ "Approved" if c.is_approved else "Pending" }})
        </span>

        {% if not c.is_approved %}
            <a href="/approve_company/{{ c.id }}" class="btn btn-success btn-sm">
                Approve
            </a>
        {% endif %}

    </div>
{% endfor %}
    </div>

    <a href="/logout" class="btn btn-danger mt-3">Logout</a>
</div>

</body>
</html>
