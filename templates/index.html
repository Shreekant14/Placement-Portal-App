<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #3b135c, #6a1b9a);
            height: 100vh;
            color: white;
        }

        .center-box {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-custom {
            background-color: white;
            color: #3b135c;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

<div class="center-box">
    <h1 class="mb-3">Placement Portal</h1>
    <p class="mb-4">Connecting Students with Opportunities</p>

    <div>
        <a href="/login" class="btn btn-custom me-2">Login</a>
        <a href="/register" class="btn btn-outline-light">Register</a>
    </div>
</div>

</body>
</html>
